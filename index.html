<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesoría de Belleza</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; padding: 20px; }
        #chat-container { width: 100%; max-width: 450px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #chat-box { height: 300px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        input { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; background-color: #ff6699; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-container">
        <h3>Asesoría de Cosméticos</h3>
        <div id="chat-box"></div>
        <input type="text" id="userInput" placeholder="Pregúntame sobre perfumes...">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        async function enviarMensaje() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const texto = input.value;
            if (!texto) return;

            chatBox.innerHTML += `<p><b>Tú:</b> ${texto}</p>`;
            input.value = '';

            try {
                // REEMPLAZA ESTA URL POR TU "PRODUCTION URL" DE N8N
                const response = await fetch('AQUÍ_VA_TU_URL_DE_PRODUCCIÓN_DE_N8N', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texto })
                });

                const data = await response.json();
                chatBox.innerHTML += `<p><b>Bot:</b> ${data.respuesta}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<p style="color:red;">Error al conectar con el bot.</p>`;
            }
        }
    </script>
</body>
</html>
