<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Cambia aquí el título de tu página -->
    <title>Maribel | Tu Asesor Personal</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #fdf2f8; display: flex; justify-content: center; padding: 20px; }
        #chat-container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 15px; border: 2px solid #ff6699; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        /* Cambia el color del título principal */
        h3 { color: #d63384; text-align: center; }
        #chat-box { height: 350px; overflow-y: scroll; border: 1px solid #eee; padding: 15px; margin-bottom: 15px; border-radius: 10px; background: #fffafb; }
        input { width: 65%; padding: 12px; border: 2px solid #ff6699; border-radius: 8px; }
        button { padding: 12px 20px; background-color: #ff6699; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #e65585; }
    </style>
</head>
<body>

    <div id="chat-container">
        <!-- Aquí puedes poner el nombre de tu marca -->
        <h3>Bienvenida a mis servicios</h3>
        <div id="chat-box"></div>
        <!-- Personaliza el texto de ayuda -->
        <input type="text" id="userInput" placeholder="¿En qué te puedo ayudar hoy?">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        async function enviarMensaje() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const texto = input.value;
            if (!texto) return;

            chatBox.innerHTML += `<p><b>Tú:</b> ${texto}</p>`;
            input.value = '';

            try {
                // MANTÉN AQUÍ TU URL DE NGROK/N8N
                const response = await fetch('https://whoops-name-walnut.ngrok-free.dev/webhook/tienda', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texto })
                });

                const data = await response.json();
                chatBox.innerHTML += `<p><b>Maribel Bot:</b> ${data.respuesta}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<p style="color:red;">Error de conexión. Asegúrate que ngrok esté activo.</p>`;
            }
        }
    </script>
</body>
</html>
